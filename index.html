<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MakerAG</title>
  <script src="/js/theme-loader.js"></script>
  <link rel="stylesheet" href="/styles/animation.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/index.css" />
  <link rel="icon" href="/images/logo.png" type="image/png" />
  <script src="/js/lang.js"></script>
  <script src="js/loader.js"></script>
</head>

<body>
  <div class="page-loader">
    <div class="loader-spinner"></div>
  </div>
  <div id="header"></div>
  <div id="nav"></div>
  <div id="settings"></div>

  <div class="container">
    <h2 data-i18n="schraenke_title">Schränke und Räume</h2>
    <div id="map">
    </div>
  </div>

  <div id="Kategorien" class="container">
    <h2 data-i18n="kategorien_title">Kategorien</h2>
    <div class="row">
      <div class="category-card"></div>
    </div>
  </div>

  <div id="neuste-eintraege" class="container">
    <h2 data-i18n="neueste_title">Neueste Einträge</h2>
    <button id="load-latest" data-i18n="btn_load_latest">Neueste Einträge laden</button>
    <div id="latest-entries"></div>
    <br /><br />
  </div>

  <div id="random-item-container" class="container">
    <h2 data-i18n="zufall_title">Zufallsgenerator</h2>
    <div class="random-item-content">
      <button id="random-item-btn" class="random-item-button" data-i18n="btn_random">
        Zufälligen Gegenstand
      </button>
      <div id="random-item-status" class="random-status"></div>
    </div>
  </div>

  <div class="cool-container">
    <div class="counter">
      <h2 data-i18n="counter_title">Anzahl gespeicherten Gegenstände</h2>
      <div id="item-count" class="count" data-i18n="counter_loading">Lade...</div>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>

</html>
