<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakerAG — Lager Map v2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0ede6;
  --surface: #ffffff;
  --border: #ddd9d0;
  --text: #1a1917;
  --muted: #8a8780;
  --green: #3a5c2e;
  --mono: 'DM Mono', monospace;
  --serif: 'Fraunces', Georgia, serif;
}

.tooltip {
  position: fixed; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 18px; pointer-events: none;
  opacity: 0; transform: translateY(6px); transition: opacity 0.15s, transform 0.15s;
  z-index: 200; min-width: 190px; box-shadow: 0 8px 32px rgba(0,0,0,0.10);
}
.tooltip.visible { opacity: 1; transform: translateY(0); }
.tt-id   { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.tt-name { font-family: var(--serif); font-size: 18px; font-weight: 300; margin-bottom: 10px; }
.tt-row  { display: flex; justify-content: space-between; gap: 24px; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.tt-row span:last-child { color: var(--text); font-weight: 500; }
.tt-bar  { height: 3px; background: var(--border); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.tt-bar-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.3s ease; }
.tt-cap  { font-size: 10px; color: var(--muted); margin-top: 5px; letter-spacing: 0.04em; }
.tt-hint { font-size: 10px; color: var(--muted); margin-top: 10px; letter-spacing: 0.04em; }



/* ── Hover-Effekt auf Objekte (CSS statt JS) ─────────────────────────────── */
.map-object .hover-face { transition: opacity 0.15s; pointer-events: none; }
.map-object:hover .hover-face { opacity: 0.13 !important; }
.map-object { cursor: pointer; }
</style>
</head>
<body>



<div class="map-wrap">
  <svg id="isomap" viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Isometrisches Gittermuster für den Hallenboden -->
      <pattern id="grid" width="58" height="33" patternUnits="userSpaceOnUse">
        <path d="M0 16.5 L29 0 L58 16.5 L29 33 Z" fill="none" stroke="#ddd8d0" stroke-width="0.5"/>
      </pattern>
    </defs>
    <g id="rooms-layer"></g>
    <g id="objects-layer"></g>
  </svg>
</div>


<script src="/js/schrank-framework.js"></script>
</body>
</html>
