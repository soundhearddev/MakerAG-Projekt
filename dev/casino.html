<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MakerAG – Zufallsgenerator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --gold-dim: #7a621e;
    --bg: #0a0a0f;
    --panel: #111118;
    --panel-border: #2a2a3a;
    --red: #d42b2b;
    --green: #1db954;
    --text: #e8e0d0;
    --text-dim: #8a8070;
    --chrome: #c8c8d8;
    --chrome-dark: #404050;
    --reel-bg: #07070c;
    --reel-item-h: 110px;
    --reel-visible: 3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'DM Mono', monospace;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 4px);
    pointer-events: none;
    z-index: 0;
  }

  .machine-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── TOP MARQUEE ───────────────────────────────────────────── */
  .marquee {
    background: linear-gradient(180deg, #1a0a00 0%, #2a1500 50%, #1a0a00 100%);
    border: 2px solid var(--gold-dim);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    padding: 14px 48px 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
    width: 620px;
  }

  .marquee::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 18px,
      rgba(201,168,76,0.06) 18px,
      rgba(201,168,76,0.06) 20px
    );
  }

  .marquee-title {
    font-family: 'Cinzel', serif;
    font-size: 2rem;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(201,168,76,0.6), 0 0 60px rgba(201,168,76,0.2);
    letter-spacing: 0.2em;
    position: relative;
  }

  .marquee-sub {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.35em;
    color: var(--gold-dim);
    margin-top: 2px;
    position: relative;
  }

  /* Bulb lights top */
  .bulbs {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 14px;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    padding: 0 10px;
  }

  .bulb {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--gold-light);
    box-shadow: 0 0 6px 2px var(--gold);
    animation: bulb-blink 1.2s ease-in-out infinite;
  }

  .bulb:nth-child(even) { animation-delay: 0.6s; }
  .bulb:nth-child(3n)   { animation-delay: 0.3s; }

  @keyframes bulb-blink {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px 2px var(--gold); }
    50%       { opacity: 0.3; box-shadow: none; }
  }

  /* ── MAIN CABINET ──────────────────────────────────────────── */
  .cabinet {
    width: 620px;
    background: linear-gradient(180deg, #161620 0%, #0e0e16 100%);
    border: 2px solid var(--gold-dim);
    border-top: none;
    border-bottom: none;
    padding: 28px 32px 24px;
    position: relative;
  }

  /* Side chrome strips */
  .cabinet::before,
  .cabinet::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 6px;
    background: linear-gradient(180deg,
      #888 0%, #ddd 20%, #aaa 40%, #fff 50%, #aaa 60%, #ddd 80%, #888 100%
    );
  }
  .cabinet::before { left: -8px; border-radius: 4px 0 0 4px; }
  .cabinet::after  { right: -8px; border-radius: 0 4px 4px 0; }

  /* ── REEL FRAME ─────────────────────────────────────────────── */
  .reel-frame {
    background: #050508;
    border: 3px solid var(--chrome-dark);
    border-radius: 8px;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.8),
      inset 0 0 2px rgba(255,255,255,0.05),
      0 0 0 1px rgba(201,168,76,0.2);
    overflow: hidden;
    position: relative;
    height: calc(var(--reel-item-h) * var(--reel-visible));
  }

  /* Scanlines */
  .reel-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.18) 3px,
      rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* Highlight stripe on center row */
  .reel-highlight {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: 0; right: 0;
    height: var(--reel-item-h);
    border-top: 2px solid rgba(201,168,76,0.5);
    border-bottom: 2px solid rgba(201,168,76,0.5);
    background: rgba(201,168,76,0.04);
    pointer-events: none;
    z-index: 9;
  }

  /* Fade top/bottom */
  .reel-fade-top,
  .reel-fade-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 80px;
    pointer-events: none;
    z-index: 8;
  }
  .reel-fade-top    { top: 0;    background: linear-gradient(180deg, #050508 0%, transparent 100%); }
  .reel-fade-bottom { bottom: 0; background: linear-gradient(0deg,   #050508 0%, transparent 100%); }

  /* ── REEL STRIP ─────────────────────────────────────────────── */
  .reel-strip {
    display: flex;
    flex-direction: column;
    will-change: transform;
  }

  .reel-item {
    height: var(--reel-item-h);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    gap: 6px;
    flex-shrink: 0;
  }

  .reel-item .item-icon {
    width: 44px; height: 44px;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    padding: 4px;
  }

  .reel-item .item-placeholder-icon {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    padding: 4px;
  }

  .reel-item .item-name {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    letter-spacing: 0.05em;
    line-height: 1.3;
    max-width: 100%;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }

  .reel-item .item-category {
    font-size: 0.58rem;
    color: var(--gold-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* ── CONTROLS ───────────────────────────────────────────────── */
  .controls {
    margin-top: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .credit-display {
    background: #07070c;
    border: 1px solid var(--chrome-dark);
    border-radius: 4px;
    padding: 8px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.12em;
    color: var(--green);
    text-shadow: 0 0 8px rgba(29,185,84,0.5);
    min-width: 120px;
    text-align: center;
  }

  .credit-label {
    font-size: 0.55rem;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 2px;
  }

  /* SPIN BUTTON */
  .spin-btn {
    flex: 1;
    max-width: 200px;
    height: 54px;
    background: linear-gradient(180deg, #c9a84c 0%, #8a6a20 50%, #c9a84c 100%);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.15em;
    color: #1a0f00;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    box-shadow:
      0 4px 0 #5a4010,
      0 6px 16px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.3);
    transition: transform 0.06s, box-shadow 0.06s;
    position: relative;
    overflow: hidden;
    user-select: none;
  }

  .spin-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.4s;
  }

  .spin-btn:hover::before { left: 150%; }

  .spin-btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #5a4010, 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .spin-btn:disabled {
    background: linear-gradient(180deg, #555 0%, #333 50%, #555 100%);
    color: #888;
    cursor: not-allowed;
    box-shadow: 0 2px 0 #222, 0 4px 8px rgba(0,0,0,0.4);
  }

  /* ── RESULT PANEL ───────────────────────────────────────────── */
  .result-panel {
    margin-top: 18px;
    background: #07070c;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 14px 20px;
    min-height: 68px;
    display: flex;
    align-items: center;
    gap: 16px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s, transform 0.4s;
  }

  .result-panel.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .result-thumb {
    width: 46px; height: 46px;
    object-fit: contain;
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    padding: 4px;
    flex-shrink: 0;
  }

  .result-thumb-placeholder {
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    flex-shrink: 0;
  }

  .result-info { flex: 1; }

  .result-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.25rem;
    letter-spacing: 0.08em;
    color: var(--gold-light);
    text-shadow: 0 0 12px rgba(201,168,76,0.4);
    line-height: 1.1;
  }

  .result-meta {
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    margin-top: 3px;
  }

  .result-link {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    color: var(--gold);
    text-decoration: none;
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 6px 14px;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .result-link:hover {
    background: var(--gold);
    color: #1a0f00;
  }

  /* ── BOTTOM CABINET ─────────────────────────────────────────── */
  .cabinet-bottom {
    width: 620px;
    height: 28px;
    background: linear-gradient(180deg, #0e0e16 0%, #1a1a28 100%);
    border: 2px solid var(--gold-dim);
    border-top: none;
    border-radius: 0 0 16px 16px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  /* Bottom bulbs */
  .cabinet-bottom .bulb {
    width: 7px; height: 7px;
  }

  /* ── WIN FLASH ──────────────────────────────────────────────── */
  @keyframes win-flash {
    0%   { box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(201,168,76,0.2); }
    25%  { box-shadow: inset 0 0 40px rgba(201,168,76,0.15), 0 0 30px rgba(201,168,76,0.4), 0 0 0 1px rgba(201,168,76,0.8); }
    75%  { box-shadow: inset 0 0 40px rgba(201,168,76,0.1), 0 0 20px rgba(201,168,76,0.2), 0 0 0 1px rgba(201,168,76,0.5); }
    100% { box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(201,168,76,0.2); }
  }

  .reel-frame.win { animation: win-flash 0.8s ease-in-out 2; }

  /* ── LOADING STATE ──────────────────────────────────────────── */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(5,5,8,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    border-radius: 6px;
  }

  .loading-spinner {
    width: 32px; height: 32px;
    border: 2px solid rgba(201,168,76,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ── STATUS TEXT ────────────────────────────────────────────── */
  .status-line {
    text-align: center;
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    margin-top: 10px;
    height: 16px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="machine-wrapper">

  <!-- TOP MARQUEE -->
  <div class="marquee">
    <div class="marquee-title">MakerAG</div>
    <div class="marquee-sub">Zufallsgenerator &nbsp;·&nbsp; Random Item Picker</div>
    <div class="bulbs" id="marquee-bulbs"></div>
  </div>

  <!-- MAIN CABINET -->
  <div class="cabinet">

    <!-- REEL -->
    <div class="reel-frame" id="reelFrame">
      <div class="reel-highlight"></div>
      <div class="reel-fade-top"></div>
      <div class="reel-fade-bottom"></div>
      <div class="reel-strip" id="reelStrip"></div>
      <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="credit-display">
        <span class="credit-label">Items geladen</span>
        <span id="creditCount">—</span>
      </div>
      <button class="spin-btn" id="spinBtn" disabled>SPIN</button>
      <div class="credit-display">
        <span class="credit-label">Letzter Spin</span>
        <span id="spinCount">0</span>
      </div>
    </div>

    <!-- RESULT -->
    <div class="result-panel" id="resultPanel">
      <div class="result-thumb-placeholder" id="resultIcon">🎲</div>
      <div class="result-info">
        <div class="result-name" id="resultName">—</div>
        <div class="result-meta" id="resultMeta"></div>
      </div>
      <a class="result-link" id="resultLink" href="#" target="_blank">Details →</a>
    </div>

    <div class="status-line" id="statusLine">Lade Items…</div>
  </div>

  <!-- BOTTOM -->
  <div class="cabinet-bottom" id="bottomBulbs"></div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const REEL_ITEM_H   = 110;   // px, must match CSS --reel-item-h
const VISIBLE_ROWS  = 3;
const API_URL       = '/api/fetch_all_items.php?limit=40&random=true';

// Emoji fallbacks per category keyword
const CATEGORY_EMOJI = {
  laptop: '💻', computer: '🖥️', monitor: '🖥️', keyboard: '⌨️',
  maus: '🖱️', mouse: '🖱️', kabel: '🔌', cable: '🔌',
  werkzeug: '🔧', tool: '🔧', löt: '🔩', schraube: '🔩',
  drucker: '🖨️', scanner: '📠', kamera: '📷', camera: '📷',
  netzwerk: '🌐', router: '📡', switch: '📡', raspberry: '🍓',
  arduino: '⚡', elektronik: '⚡', electronic: '⚡',
  lager: '📦', default: '📦',
};

function emojiForItem(item) {
  const text = ((item.category_name || '') + ' ' + (item.name || '')).toLowerCase();
  for (const [k, e] of Object.entries(CATEGORY_EMOJI)) {
    if (text.includes(k)) return e;
  }
  return CATEGORY_EMOJI.default;
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let items       = [];
let spinning    = false;
let spinCount   = 0;
let winItem     = null;

// ── DOM REFS ──────────────────────────────────────────────────────────────────
const reelFrame    = document.getElementById('reelFrame');
const reelStrip    = document.getElementById('reelStrip');
const loadingOvl   = document.getElementById('loadingOverlay');
const spinBtn      = document.getElementById('spinBtn');
const creditCount  = document.getElementById('creditCount');
const spinCountEl  = document.getElementById('spinCount');
const resultPanel  = document.getElementById('resultPanel');
const resultIcon   = document.getElementById('resultIcon');
const resultName   = document.getElementById('resultName');
const resultMeta   = document.getElementById('resultMeta');
const resultLink   = document.getElementById('resultLink');
const statusLine   = document.getElementById('statusLine');

// ── BULBS ─────────────────────────────────────────────────────────────────────
function spawnBulbs(containerId, count) {
  const el = document.getElementById(containerId);
  if (!el) return;
  for (let i = 0; i < count; i++) {
    const b = document.createElement('div');
    b.className = 'bulb';
    el.appendChild(b);
  }
}
spawnBulbs('marquee-bulbs', 22);
spawnBulbs('bottomBulbs',   18);

// ── FETCH ITEMS ───────────────────────────────────────────────────────────────
async function loadItems() {
  try {
    const res  = await fetch(API_URL);
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'API error');
    items = (json.data || []).filter(i => i.id && i.name);
    if (items.length < 3) throw new Error('Zu wenige Items');

    creditCount.textContent = items.length;
    statusLine.textContent  = 'Bereit — drücke SPIN';
    loadingOvl.style.display = 'none';
    spinBtn.disabled = false;
    buildReel();
  } catch (e) {
    statusLine.textContent = 'Fehler: ' + e.message;
    loadingOvl.innerHTML = '<span style="color:#d42b2b;font-size:.75rem;letter-spacing:.1em">LADEFEHLER</span>';
  }
}

// ── BUILD REEL STRIP ──────────────────────────────────────────────────────────
// Fill with shuffled items, repeat enough for smooth long spin
function buildReel(targetIndex = null) {
  // Build a long list: 4 full shuffles + the target in center pos
  const pool = [...items].sort(() => Math.random() - 0.5);

  // We'll show VISIBLE_ROWS items; center (index 1) = result
  // Total items in strip: pool * repeats
  const repeats = 6;
  const extended = [];
  for (let r = 0; r < repeats; r++) {
    extended.push(...[...pool].sort(() => Math.random() - 0.5));
  }

  // If a target is specified, place it at the center of the last visible window
  // We'll land on extended[landIndex], show landIndex-1, landIndex, landIndex+1
  let landIndex = extended.length - Math.floor(pool.length * 1.5);
  if (targetIndex !== null) {
    extended[landIndex] = items[targetIndex];
  }

  reelStrip.innerHTML = '';
  extended.forEach(item => {
    reelStrip.appendChild(makeReelItem(item));
  });

  return { extended, landIndex };
}

function makeReelItem(item) {
  const div = document.createElement('div');
  div.className = 'reel-item';

  const emoji = emojiForItem(item);

  if (item.thumbnail) {
    const img = document.createElement('img');
    img.className = 'item-icon';
    img.src = item.thumbnail;
    img.alt = item.name;
    img.onerror = () => {
      img.replaceWith(makePlaceholderIcon(emoji));
    };
    div.appendChild(img);
  } else {
    div.appendChild(makePlaceholderIcon(emoji));
  }

  const name = document.createElement('div');
  name.className = 'item-name';
  name.textContent = item.name;
  div.appendChild(name);

  if (item.category_name) {
    const cat = document.createElement('div');
    cat.className = 'item-category';
    cat.textContent = item.category_name;
    div.appendChild(cat);
  }

  return div;
}

function makePlaceholderIcon(emoji) {
  const span = document.createElement('div');
  span.className = 'item-placeholder-icon';
  span.textContent = emoji;
  return span;
}

// ── SPIN LOGIC ────────────────────────────────────────────────────────────────
function spin() {
  if (spinning || items.length < 3) return;
  spinning = true;
  spinBtn.disabled = true;
  resultPanel.classList.remove('visible');
  reelFrame.classList.remove('win');
  statusLine.textContent = 'Spinning…';

  // Pick winner
  const winIdx = Math.floor(Math.random() * items.length);
  winItem = items[winIdx];

  // Rebuild reel with target
  const { extended, landIndex } = buildReel(winIdx);

  // Initial position: show first 3 items (center on index 1)
  const startY = -REEL_ITEM_H; // center on index 1
  reelStrip.style.transition = 'none';
  reelStrip.style.transform  = `translateY(${startY}px)`;

  // Final Y: center visible window on landIndex
  // The visible window center is at REEL_ITEM_H (middle of 3 visible rows)
  // We need: startY + delta = -(landIndex * REEL_ITEM_H) + REEL_ITEM_H
  const finalY = -(landIndex * REEL_ITEM_H) + REEL_ITEM_H;

  // Total scroll distance
  const totalDist = Math.abs(finalY - startY);

  // Spin duration based on distance (min 2s, max 4.5s)
  const duration = Math.min(4500, Math.max(2000, totalDist / 8));

  // Force reflow then animate
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      reelStrip.style.transition = `transform ${duration}ms cubic-bezier(0.25, 0.1, 0.08, 1.0)`;
      reelStrip.style.transform  = `translateY(${finalY}px)`;
    });
  });

  // On finish
  setTimeout(() => {
    // Snap to clean final position
    reelStrip.style.transition = 'none';
    reelStrip.style.transform  = `translateY(${finalY}px)`;

    // Win flash
    reelFrame.classList.add('win');

    // Show result
    showResult(winItem);

    spinCount++;
    spinCountEl.textContent = spinCount;
    statusLine.textContent  = '✦ ' + winItem.name;

    spinning = false;
    spinBtn.disabled = false;
  }, duration + 80);
}

function showResult(item) {
  const emoji = emojiForItem(item);

  resultIcon.innerHTML = '';
  if (item.thumbnail) {
    const img = document.createElement('img');
    img.className = 'result-thumb';
    img.src = item.thumbnail;
    img.alt = item.name;
    img.onerror = () => {
      img.replaceWith(makePlaceholderResult(emoji));
    };
    resultIcon.appendChild(img);
  } else {
    resultIcon.appendChild(makePlaceholderResult(emoji));
  }

  resultName.textContent = item.name;

  const parts = [];
  if (item.category_name)    parts.push(item.category_name);
  if (item.locker)           parts.push('Schrank ' + item.locker);
  if (item.shelf)            parts.push('fach ' + item.shelf);
  if (item.brand)            parts.push(item.brand);
  resultMeta.textContent = parts.join('  ·  ');

  resultLink.href = `/item.html?id=${item.id}`;

  resultPanel.classList.add('visible');
}

function makePlaceholderResult(emoji) {
  const div = document.createElement('div');
  div.className = 'result-thumb-placeholder';
  div.textContent = emoji;
  return div;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
spinBtn.addEventListener('click', spin);
loadItems();
</script>
</body>
